<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LKPD Geografi Kelas X</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-800"><header class="bg-emerald-700 text-white p-4 sticky top-0 z-10"><div class="max-w-6xl mx-auto"><h1 class="text-xl font-bold">E-LKPD Geografi Kelas X (Fase E)</h1><p class="text-sm">Kurikulum Merdeka • 14 LKPD</p></div></header><div class="max-w-6xl mx-auto grid lg:grid-cols-[280px_1fr] gap-4 p-4"><aside class="bg-white rounded-xl p-3 h-fit lg:sticky lg:top-24"><input id="search" oninput="nav()" class="w-full border rounded p-2 text-sm mb-2" placeholder="Cari LKPD..."><div id="nav"></div></aside><main id="app"></main></div><script src="data1.js"></script><script src="data2.js"></script><script src="data3.js"></script><script src="data4.js"></script><script>let id=1,A=JSON.parse(localStorage.getItem('elkpd_answers')||'{}');const save=(k,v)=>{A[k]=v;localStorage.setItem('elkpd_answers',JSON.stringify(A))};function nav(){let q=search.value.toLowerCase();document.getElementById('nav').innerHTML=lkpdParts.filter(x=>(x.title+x.subtitle+x.category).toLowerCase().includes(q)).map(x=>`<button onclick="id=${x.id};render()" class="block w-full text-left p-2 rounded hover:bg-emerald-50 text-sm">${x.id}. ${x.title.replace(/^LKPD \d+: /,'')}</button>`).join('')}function render(){let x=lkpdParts.find(a=>a.id===id);app.innerHTML=`<article class="space-y-4"><section class="bg-white rounded-2xl p-6 shadow-sm"><span class="text-xs font-bold text-emerald-700">${x.category} • ${x.time}</span><h2 class="text-2xl font-bold mt-2">${x.title}</h2><p class="text-slate-600">${x.subtitle}</p><div class="grid md:grid-cols-2 gap-3 mt-5"><div class="bg-slate-50 p-4 rounded-xl"><b>Capaian Pembelajaran</b><p class="text-sm mt-1">${x.cp}</p></div><div class="bg-slate-50 p-4 rounded-xl"><b>Tujuan Pembelajaran</b><ul class="text-sm list-disc ml-5 mt-1">${x.tp.map(t=>`<li>${t}</li>`).join('')}</ul></div></div></section><section class="bg-amber-50 border border-amber-200 rounded-2xl p-6"><b>💡 ${x.stimulus.title}</b><p class="mt-2 text-sm leading-relaxed">${x.stimulus.text}</p></section><section class="bg-white rounded-2xl p-6 shadow-sm"><h3 class="font-bold mb-4">Pertanyaan Pemahaman & HOTS</h3>${x.essayQuestions.map((q,i)=>`<div class="border-b py-4"><p class="font-semibold text-sm">${i+1}. ${q.question}</p><p class="text-xs text-amber-700 bg-amber-50 p-2 rounded mt-2">Petunjuk: ${q.hint}</p><textarea oninput="save('${q.id}',this.value)" rows="4" class="w-full border rounded-xl p-3 mt-2 text-sm" placeholder="Tuliskan jawaban Anda...">${A[q.id]||''}</textarea></div>`).join('')}</section><section class="bg-white rounded-2xl p-6 shadow-sm"><h3 class="font-bold">Refleksi Peserta Didik</h3><textarea oninput="save('ref_${x.id}_1',this.value)" rows="3" class="w-full border rounded-xl p-3 mt-3" placeholder="Apa hal paling bermakna yang Anda pelajari?"></textarea><textarea oninput="save('ref_${x.id}_2',this.value)" rows="3" class="w-full border rounded-xl p-3 mt-3" placeholder="Bagian yang masih sulit..."></textarea></section></article>`;scrollTo({top:0,behavior:'smooth'})}nav();render();</script></body></html>
